name: Déploiement Infomaniak

# Déclenchement manuel uniquement. Tant que les mentions légales sont incomplètes
# et que le formulaire n'a pas de destinataire, un déploiement automatique sur
# push publierait un site non publiable. Ajouter le déclencheur `push` quand le
# site est prêt.
on:
  workflow_dispatch:
    inputs:
      essai:
        description: 'Simulation rsync, sans rien écrire sur le serveur'
        type: boolean
        default: true
      preversion:
        description: 'Cible la préversion protégée. Décocher publie en production.'
        type: boolean
        default: true

concurrency:
  group: deploiement
  cancel-in-progress: false

jobs:
  deployer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run check

      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      # La décision « déploiement manuel uniquement » repose sur la vigilance
      # humaine. Cette garde la confie à la machine pour la seule opération
      # irréversible : la publication sur le domaine public.
      - name: Garde de publication
        if: ${{ inputs.essai == false && inputs.preversion == false }}
        run: |
          echec=0
          if grep -rq 'À COMPLÉTER' dist/; then
            echo "::error::Des marqueurs [À COMPLÉTER] sont encore visibles publiquement."
            echec=1
          fi
          # Cibler la constante, pas le fichier : `contact.php` garde une garde
          # défensive qui contient le même littéral et resterait détectée.
          if grep -q "DESTINATAIRE = 'A_COMPLETER" dist/api/contact.php; then
            echo "::error::Le formulaire n'a pas de destinataire, il renverrait un 503."
            echec=1
          fi
          # Le deux-points est ce qui distingue la clé JSON-LD du champ de
          # formulaire `id="telephone"`, présent dans la page en toute hypothèse.
          if ! grep -q '"telephone":' dist/index.html; then
            echo "::error::Le téléphone est absent du JSON-LD, donc du site entier."
            echec=1
          fi
          exit $echec

      # Variables à définir dans le dépôt :
      #   secrets.SSH_CLE_PRIVEE   clé privée du compte SSH Infomaniak
      #   vars.SSH_HOTE            hôte SSH
      #   vars.SSH_UTILISATEUR     utilisateur SSH
      #   vars.SSH_PORT            port SSH, 22 par défaut
      #   vars.CHEMIN_DISTANT      racine web du site, avec un / final
      #   vars.SSH_HOTE_CLE        empreinte publique de l'hôte (recommandé)
      #   vars.SITE_URL            https://matlofleurs.fr, sert au build
      #   vars.URL_VERIFICATION    URL réellement servie, à retirer à la bascule
      #   secrets.PREVERSION_AUTH  utilisateur:motdepasse de la préversion
      - name: Préparer la connexion SSH
        env:
          CLE: ${{ secrets.SSH_CLE_PRIVEE }}
          HOTE: ${{ vars.SSH_HOTE }}
          PORT: ${{ vars.SSH_PORT }}
          HOTE_CLE: ${{ vars.SSH_HOTE_CLE }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$CLE" > ~/.ssh/id_deploiement
          chmod 600 ~/.ssh/id_deploiement
          if [ -n "$HOTE_CLE" ]; then
            printf '%s\n' "$HOTE_CLE" > ~/.ssh/known_hosts
          else
            echo "::warning::SSH_HOTE_CLE non définie, l'empreinte de l'hôte est acceptée à l'aveugle."
            ssh-keyscan -p "${PORT:-22}" "$HOTE" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      # --delete nettoie les fichiers retirés du site, mais trois choses posées
      # par Infomaniak dans la racine web doivent survivre : les jetons de
      # certificat de .well-known, la compression PHP de .user.ini, et la page
      # servie par le mode maintenance du manager.
      - name: Publier avec rsync
        env:
          HOTE: ${{ vars.SSH_HOTE }}
          UTILISATEUR: ${{ vars.SSH_UTILISATEUR }}
          PORT: ${{ vars.SSH_PORT }}
          CHEMIN: ${{ vars.CHEMIN_DISTANT }}
          ESSAI: ${{ inputs.essai }}
        run: |
          set -euo pipefail
          # Tableau et non chaîne : un motif à joker survivrait mal à la
          # découpe en mots que subit une variable non protégée.
          OPTIONS=(-az --delete --exclude .well-known --exclude .git
                   --exclude .user.ini --exclude '.infomaniak-*')
          if [ "$ESSAI" = "true" ]; then
            OPTIONS+=(--dry-run --itemize-changes)
            echo "::notice::Simulation, aucune écriture sur le serveur."
          fi
          rsync "${OPTIONS[@]}" \
            -e "ssh -i ~/.ssh/id_deploiement -p ${PORT:-22} -o StrictHostKeyChecking=yes" \
            dist/ "$UTILISATEUR@$HOTE:$CHEMIN"

      # L'URL contrôlée n'est pas celle du build : tant que le site vit sur la
      # préversion, SITE_URL désigne un domaine encore muet. Et la préversion est
      # protégée par mot de passe, donc un contrôle sans identifiants ne verrait
      # que des 401.
      - name: Vérifier la mise en ligne
        if: ${{ inputs.essai == false }}
        env:
          SITE: ${{ vars.URL_VERIFICATION || vars.SITE_URL }}
          AUTH: ${{ secrets.PREVERSION_AUTH }}
        run: |
          set -euo pipefail
          for chemin in / /mentions-legales /politique-de-confidentialite; do
            code=$(curl -s -o /dev/null -w '%{http_code}' ${AUTH:+--user "$AUTH"} "$SITE$chemin")
            echo "$chemin -> $code"
            [ "$code" = "200" ] || exit 1
          done
