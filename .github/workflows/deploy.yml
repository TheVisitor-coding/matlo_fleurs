name: Déploiement Infomaniak

# Déclenchement manuel uniquement. Tant que les mentions légales sont incomplètes
# et que le formulaire n'a pas de destinataire, un déploiement automatique sur
# push publierait un site non publiable. Ajouter le déclencheur `push` quand le
# site est prêt.
on:
  workflow_dispatch:
    inputs:
      essai:
        description: 'Simulation rsync, sans rien écrire sur le serveur'
        type: boolean
        default: true
      preversion:
        description: 'Cible la préversion protégée. Décocher publie en production.'
        type: boolean
        default: true

concurrency:
  group: deploiement
  cancel-in-progress: false

jobs:
  deployer:
    runs-on: ubuntu-latest
    steps:
      # Une variable de dépôt absente arrive comme chaîne vide, sans erreur.
      # Avec CHEMIN_DISTANT vide, rsync --delete viserait le répertoire personnel
      # du compte SSH et en effacerait le contenu, `sites/` compris.
      - name: Vérifier la configuration du dépôt
        env:
          SSH_HOTE: ${{ secrets.SSH_HOTE }}
          SSH_UTILISATEUR: ${{ secrets.SSH_UTILISATEUR }}
          CHEMIN_DISTANT: ${{ secrets.CHEMIN_DISTANT }}
          SITE_URL: ${{ secrets.SITE_URL }}
          SSH_CLE_PRIVEE: ${{ secrets.SSH_CLE_PRIVEE }}
        run: |
          manque=0
          for nom in SSH_HOTE SSH_UTILISATEUR CHEMIN_DISTANT SITE_URL SSH_CLE_PRIVEE; do
            if [ -z "${!nom}" ]; then
              echo "::error::$nom est vide ou absente. Vérifier l'onglet Secrets."
              manque=1
            fi
          done
          case "$CHEMIN_DISTANT" in
            */) ;;
            *) echo "::error::CHEMIN_DISTANT doit se terminer par un /."; manque=1 ;;
          esac
          exit $manque

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run check

      - run: npm run build
        env:
          SITE_URL: ${{ secrets.SITE_URL }}

      # La décision « déploiement manuel uniquement » repose sur la vigilance
      # humaine. Cette garde la confie à la machine pour la seule opération
      # irréversible : la publication sur le domaine public.
      - name: Garde de publication
        if: ${{ inputs.essai == false && inputs.preversion == false }}
        run: |
          echec=0
          if grep -rq 'À COMPLÉTER' dist/; then
            echo "::error::Des marqueurs [À COMPLÉTER] sont encore visibles publiquement."
            echec=1
          fi
          # Cibler la constante, pas le fichier : `contact.php` garde une garde
          # défensive qui contient le même littéral et resterait détectée.
          if grep -q "DESTINATAIRE = 'A_COMPLETER" dist/api/contact.php; then
            echo "::error::Le formulaire n'a pas de destinataire, il renverrait un 503."
            echec=1
          fi
          # Le deux-points est ce qui distingue la clé JSON-LD du champ de
          # formulaire `id="telephone"`, présent dans la page en toute hypothèse.
          if ! grep -q '"telephone":' dist/index.html; then
            echo "::error::Le téléphone est absent du JSON-LD, donc du site entier."
            echec=1
          fi
          # Oublier de retirer ce noindex publierait un site que Google
          # n'indexerait jamais, panne silencieuse et coûteuse pour un commerce
          # local. La garde échoue donc tant qu'il est présent.
          if grep -q 'X-Robots-Tag' dist/.htaccess; then
            echo "::error::Le noindex d'avant ouverture est encore dans .htaccess."
            echec=1
          fi
          exit $echec

      # Tout est en secrets, y compris ce qui n'est pas sensible : GitHub les
      # masque dans les logs, ce qui rend le diagnostic plus aveugle mais garde
      # une seule source à maintenir.
      #   SSH_CLE_PRIVEE     clé privée du compte SSH Infomaniak
      #   SSH_HOTE           hôte SSH
      #   SSH_UTILISATEUR    utilisateur SSH
      #   SSH_PORT           port SSH, 22 par défaut
      #   CHEMIN_DISTANT     racine web du site, avec un / final
      #   SSH_HOTE_CLE       empreinte publique de l'hôte (recommandé)
      #   SITE_URL           https://matlofleurs.fr, sert au build
      #   URL_VERIFICATION   URL contrôlée si différente de SITE_URL, facultative
      #   PREVERSION_AUTH    utilisateur:motdepasse, si le site est protégé
      - name: Préparer la connexion SSH
        env:
          CLE: ${{ secrets.SSH_CLE_PRIVEE }}
          HOTE: ${{ secrets.SSH_HOTE }}
          PORT: ${{ secrets.SSH_PORT }}
          HOTE_CLE: ${{ secrets.SSH_HOTE_CLE }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$CLE" > ~/.ssh/id_deploiement
          chmod 600 ~/.ssh/id_deploiement
          if [ -n "$HOTE_CLE" ]; then
            printf '%s\n' "$HOTE_CLE" > ~/.ssh/known_hosts
          else
            echo "::warning::SSH_HOTE_CLE non définie, l'empreinte de l'hôte est acceptée à l'aveugle."
            ssh-keyscan -p "${PORT:-22}" "$HOTE" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      # --delete nettoie les fichiers retirés du site, mais trois choses posées
      # par Infomaniak dans la racine web doivent survivre : les jetons de
      # certificat de .well-known, la compression PHP de .user.ini, et la page
      # servie par le mode maintenance du manager.
      - name: Publier avec rsync
        env:
          HOTE: ${{ secrets.SSH_HOTE }}
          UTILISATEUR: ${{ secrets.SSH_UTILISATEUR }}
          PORT: ${{ secrets.SSH_PORT }}
          CHEMIN: ${{ secrets.CHEMIN_DISTANT }}
          ESSAI: ${{ inputs.essai }}
        run: |
          set -euo pipefail
          # Tableau et non chaîne : un motif à joker survivrait mal à la
          # découpe en mots que subit une variable non protégée.
          OPTIONS=(-az --delete --exclude .well-known --exclude .git
                   --exclude .user.ini --exclude '.infomaniak-*')
          if [ "$ESSAI" = "true" ]; then
            OPTIONS+=(--dry-run --itemize-changes)
            echo "::notice::Simulation, aucune écriture sur le serveur."
          fi
          rsync "${OPTIONS[@]}" \
            -e "ssh -i ~/.ssh/id_deploiement -p ${PORT:-22} -o StrictHostKeyChecking=yes" \
            dist/ "$UTILISATEUR@$HOTE:$CHEMIN"

      # URL_VERIFICATION permet de contrôler une adresse différente de celle du
      # build. Absente, on retombe sur SITE_URL. AUTH ne sert que si le site est
      # protégé par mot de passe, sinon l'option disparaît de la commande.
      - name: Vérifier la mise en ligne
        if: ${{ inputs.essai == false }}
        env:
          SITE: ${{ secrets.URL_VERIFICATION || secrets.SITE_URL }}
          AUTH: ${{ secrets.PREVERSION_AUTH }}
        run: |
          set -euo pipefail
          for chemin in / /mentions-legales /politique-de-confidentialite; do
            code=$(curl -s -o /dev/null -w '%{http_code}' ${AUTH:+--user "$AUTH"} "$SITE$chemin")
            echo "$chemin -> $code"
            [ "$code" = "200" ] || exit 1
          done
